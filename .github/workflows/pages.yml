name: Deploy GitHub Pages

# Publica automaticamente el sitio estatico en GitHub Pages
# cada vez que se hace push a la rama main (y manualmente con workflow_dispatch).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permisos minimos necesarios para el despliegue a Pages
permissions:
  contents: read
  pages: write
  id-token: write

# No cancelar un despliegue en curso para evitar estados intermedios
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configurar Pages
        uses: actions/configure-pages@v6.0.0

      - name: Subir artefacto (raiz del repo)
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .

      # GitHub indexa el artefacto con algo de retardo; evita el error
      # "No artifacts named github-pages were found" por carrera de metadatos.
      - name: Esperar a que el artefacto se indexe
        run: sleep 20

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
