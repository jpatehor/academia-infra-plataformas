<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" role="img" aria-label="Monitoreo con CloudWatch y alarmas">
  <rect width="540" height="250" fill="#0f0f12"/>
  <text x="16" y="26" fill="#FDDA24" font-family="system-ui,sans-serif" font-size="14" font-weight="800">MONITOREO · CloudWatch</text>
  <g font-family="system-ui,sans-serif">
    <rect x="30" y="44" width="300" height="150" rx="12" fill="#16161a" stroke="#2b2b31"/>
    <text x="46" y="66" fill="#9a9aa3" font-size="11" font-weight="700">CPUUtilization (%)</text>
    <polyline points="48,168 84,150 120,155 156,120 192,132 228,96 264,74 300,60" fill="none" stroke="#FDDA24" stroke-width="3"/>
    <line x1="48" y1="84" x2="300" y2="84" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="304" y="88" fill="#f85149" font-size="10" font-weight="700">Umbral 70%</text>
    <circle cx="264" cy="74" r="5" fill="#f85149"/>
    <text x="46" y="184" fill="#9a9aa3" font-size="10">Alarma dispara → SNS / auto-scaling / remediation</text>
    <rect x="350" y="44" width="160" height="150" rx="12" fill="#16161a" stroke="#2b2b31"/>
    <text x="430" y="70" fill="#f5f5f6" font-size="12" font-weight="700" text-anchor="middle">Métricas</text>
    <text x="430" y="94" fill="#9a9aa3" font-size="11" text-anchor="middle">CloudWatch</text>
    <line x1="366" y1="110" x2="494" y2="110" stroke="#2b2b31"/>
    <text x="430" y="136" fill="#f5f5f6" font-size="12" font-weight="700" text-anchor="middle">Auditoría API</text>
    <text x="430" y="160" fill="#9a9aa3" font-size="11" text-anchor="middle">CloudTrail</text>
    <line x1="366" y1="176" x2="494" y2="176" stroke="#2b2b31"/>
    <text x="430" y="196" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Auto Scaling</text>
    <text x="270" y="234" fill="#9a9aa3" font-size="11" text-anchor="middle">Escalar por CPU o cola · RTO = tiempo de recuperación · RPO = pérdida de datos</text>
  </g>
</svg>
