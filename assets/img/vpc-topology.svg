<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-label="Topología de VPC con subredes">
  <rect width="520" height="340" fill="#0f0f12"/>
  <text x="16" y="26" fill="#FDDA24" font-family="system-ui,sans-serif" font-size="14" font-weight="800">VPC — TOPOLOGÍA</text>
  <g font-family="system-ui,sans-serif">
    <!-- IGW -->
    <rect x="200" y="44" width="120" height="34" rx="8" fill="#1c1c20" stroke="#FDDA24"/>
    <text x="260" y="66" fill="#f5f5f6" font-size="12" font-weight="700" text-anchor="middle">Internet GW</text>
    <!-- VPC -->
    <rect x="30" y="96" width="460" height="220" rx="14" fill="none" stroke="#FDDA24" stroke-dasharray="7 5"/>
    <text x="44" y="118" fill="#FDDA24" font-size="12" font-weight="800">VPC 10.x.0.0/16</text>
    <!-- subnet publica -->
    <rect x="48" y="134" width="200" height="150" rx="12" fill="#16161a" stroke="#2b2b31"/>
    <text x="62" y="156" fill="#39c5cf" font-size="12" font-weight="700">Subred PÚBLICA</text>
    <rect x="70" y="176" width="156" height="40" rx="8" fill="#1c1c20" stroke="#2b2b31"/>
    <text x="148" y="201" fill="#f5f5f6" font-size="12" text-anchor="middle">NAT Gateway</text>
    <text x="70" y="248" fill="#9a9aa3" font-size="11">route → 0.0.0.0/0 → IGW</text>
    <text x="70" y="266" fill="#9a9aa3" font-size="11">tiene IP pública</text>
    <!-- subnet privada -->
    <rect x="272" y="134" width="200" height="150" rx="12" fill="#16161a" stroke="#2b2b31"/>
    <text x="286" y="156" fill="#a371f7" font-size="12" font-weight="700">Subred PRIVADA</text>
    <rect x="300" y="176" width="144" height="56" rx="8" fill="#1c1c20" stroke="#FDDA24"/>
    <text x="372" y="200" fill="#f5f5f6" font-size="12" font-weight="700" text-anchor="middle">EC2</text>
    <text x="372" y="218" fill="#9a9aa3" font-size="10" text-anchor="middle">Amazon Linux 2023</text>
    <text x="286" y="256" fill="#9a9aa3" font-size="11">sin IP pública</text>
    <text x="286" y="272" fill="#9a9aa3" font-size="11">salida vía NAT</text>
    <!-- flecha -->
    <line x1="260" y1="78" x2="260" y2="96" stroke="#FDDA24" stroke-width="2"/>
    <line x1="148" y1="216" x2="148" y2="300" stroke="#39c5cf" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="372" y1="216" x2="372" y2="300" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
</svg>
