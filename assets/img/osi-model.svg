<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-label="Modelo OSI de 7 capas">
  <rect width="480" height="340" fill="#0f0f12"/>
  <text x="16" y="26" fill="#FDDA24" font-family="system-ui,sans-serif" font-size="14" font-weight="800">MODELO OSI — 7 CAPAS</text>
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f5f5f6">
    <g>
      <rect x="90" y="42"  width="300" height="36" rx="8" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="104" y="65" fill="#FDDA24" font-weight="800">7</text><text x="126" y="65">Aplicación</text><text x="300" y="65" fill="#9a9aa3" font-size="11">HTTP · DNS · SMTP</text>
    </g>
    <g>
      <rect x="90" y="82" width="300" height="36" rx="8" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="104" y="105" fill="#FDDA24" font-weight="800">6</text><text x="126" y="105">Presentación</text><text x="300" y="105" fill="#9a9aa3" font-size="11">Cifrado · TLS</text>
    </g>
    <g>
      <rect x="90" y="122" width="300" height="36" rx="8" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="104" y="145" fill="#FDDA24" font-weight="800">5</text><text x="126" y="145">Sesión</text><text x="300" y="145" fill="#9a9aa3" font-size="11">Sesiones</text>
    </g>
    <g>
      <rect x="90" y="162" width="300" height="36" rx="8" fill="#1c1c20" stroke="#FDDA24"/>
      <text x="104" y="185" fill="#FDDA24" font-weight="800">4</text><text x="126" y="185">Transporte</text><text x="300" y="185" fill="#9a9aa3" font-size="11">TCP · UDP</text>
    </g>
    <g>
      <rect x="90" y="202" width="300" height="36" rx="8" fill="#1c1c20" stroke="#FDDA24"/>
      <text x="104" y="225" fill="#FDDA24" font-weight="800">3</text><text x="126" y="225">Red</text><text x="300" y="225" fill="#9a9aa3" font-size="11">IP · Router</text>
    </g>
    <g>
      <rect x="90" y="242" width="300" height="36" rx="8" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="104" y="265" fill="#FDDA24" font-weight="800">2</text><text x="126" y="265">Enlace</text><text x="300" y="265" fill="#9a9aa3" font-size="11">MAC · Switch</text>
    </g>
    <g>
      <rect x="90" y="282" width="300" height="36" rx="8" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="104" y="305" fill="#FDDA24" font-weight="800">1</text><text x="126" y="305">Físico</text><text x="300" y="305" fill="#9a9aa3" font-size="11">Cable · Bit</text>
    </g>
  </g>
  <text x="400" y="160" fill="#9a9aa3" font-family="system-ui,sans-serif" font-size="10" transform="rotate(90 400 160)">ROUTER = capa 3 · SWITCH = capa 2</text>
</svg>
