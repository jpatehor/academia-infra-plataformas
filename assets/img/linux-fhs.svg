<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-label="Jerarquía de directorios de Linux">
  <rect width="520" height="340" fill="#0f0f12"/>
  <text x="16" y="26" fill="#FDDA24" font-family="system-ui,sans-serif" font-size="14" font-weight="800">JERARQUÍA LINUX (FHS)</text>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#f5f5f6">
    <rect x="30" y="46" width="70" height="34" rx="8" fill="#FDDA24"/>
    <text x="65" y="68" fill="#111" font-weight="800" text-anchor="middle">/</text>
    <line x1="65" y1="80" x2="65" y2="104" stroke="#2b2b31" stroke-width="2"/>
    <line x1="65" y1="104" x2="430" y2="104" stroke="#2b2b31" stroke-width="2"/>
    <g stroke="#2b2b31" stroke-width="2">
      <line x1="100" y1="104" x2="100" y2="126"/>
      <line x1="220" y1="104" x2="220" y2="126"/>
      <line x1="340" y1="104" x2="340" y2="126"/>
      <line x1="430" y1="104" x2="430" y2="126"/>
    </g>
    <g>
      <rect x="56" y="126" width="90" height="34" rx="7" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="101" y="148" text-anchor="middle">/etc</text>
      <text x="101" y="184" fill="#9a9aa3" font-size="11" text-anchor="middle">Configuración</text>
    </g>
    <g>
      <rect x="176" y="126" width="90" height="34" rx="7" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="221" y="148" text-anchor="middle">/var/log</text>
      <text x="221" y="184" fill="#9a9aa3" font-size="11" text-anchor="middle">Logs</text>
    </g>
    <g>
      <rect x="296" y="126" width="90" height="34" rx="7" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="341" y="148" text-anchor="middle">/home</text>
      <text x="341" y="184" fill="#9a9aa3" font-size="11" text-anchor="middle">Usuarios</text>
    </g>
    <g>
      <rect x="386" y="126" width="90" height="34" rx="7" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="431" y="148" text-anchor="middle">/proc</text>
      <text x="431" y="184" fill="#9a9aa3" font-size="11" text-anchor="middle">Virtual (kernel)</text>
    </g>
    <g>
      <rect x="56" y="212" width="90" height="34" rx="7" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="101" y="234" text-anchor="middle">/tmp</text>
      <text x="101" y="270" fill="#9a9aa3" font-size="11" text-anchor="middle">Temporal</text>
    </g>
    <g>
      <rect x="176" y="212" width="90" height="34" rx="7" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="221" y="234" text-anchor="middle">/usr</text>
      <text x="221" y="270" fill="#9a9aa3" font-size="11" text-anchor="middle">Binarios</text>
    </g>
    <g>
      <rect x="296" y="212" width="90" height="34" rx="7" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="341" y="234" text-anchor="middle">/opt</text>
      <text x="341" y="270" fill="#9a9aa3" font-size="11" text-anchor="middle">Software 3°</text>
    </g>
    <g>
      <rect x="386" y="212" width="90" height="34" rx="7" fill="#1c1c20" stroke="#2b2b31"/>
      <text x="431" y="234" text-anchor="middle">/root</text>
      <text x="431" y="270" fill="#9a9aa3" font-size="11" text-anchor="middle">Home de root</text>
    </g>
    <line x1="101" y1="160" x2="101" y2="212" stroke="#2b2b31" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="221" y1="160" x2="221" y2="212" stroke="#2b2b31" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
</svg>
