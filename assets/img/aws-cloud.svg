<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="Servicios de AWS y regiones">
  <rect width="560" height="260" fill="#0f0f12"/>
  <text x="16" y="26" fill="#FDDA24" font-family="system-ui,sans-serif" font-size="14" font-weight="800">AWS · REGIÓN y SERVICIOS</text>
  <g font-family="system-ui,sans-serif" font-size="12">
    <rect x="30" y="44" width="240" height="170" rx="12" fill="none" stroke="#FDDA24" stroke-dasharray="6 5"/>
    <text x="44" y="66" fill="#FDDA24" font-weight="700" font-size="11">REGIÓN · us-east-1</text>
    <rect x="44" y="78" width="106" height="60" rx="8" fill="#1c1c20" stroke="#39c5cf"/>
    <text x="97" y="102" text-anchor="middle" fill="#39c5cf" font-weight="700" font-size="11">Zona A</text>
    <text x="97" y="122" text-anchor="middle" fill="#9a9aa3" font-size="10">datacenter 1</text>
    <rect x="160" y="78" width="106" height="60" rx="8" fill="#1c1c20" stroke="#39c5cf"/>
    <text x="213" y="102" text-anchor="middle" fill="#39c5cf" font-weight="700" font-size="11">Zona B</text>
    <text x="213" y="122" text-anchor="middle" fill="#9a9aa3" font-size="10">aislada</text>
    <text x="150" y="172" text-anchor="middle" fill="#9a9aa3" font-size="10">Alta disponibilidad =</text>
    <text x="150" y="188" text-anchor="middle" fill="#9a9aa3" font-size="10">desplegar en 2 AZ</text>

    <g>
      <rect x="300" y="48" width="230" height="44" rx="9" fill="#1c1c20" stroke="#a371f7"/>
      <text x="415" y="70" text-anchor="middle" fill="#f5f5f6" font-weight="700">EC2 · Instancia</text>
      <text x="415" y="86" text-anchor="middle" fill="#9a9aa3" font-size="10">AMI + rol IAM + SSM</text>
      <rect x="300" y="100" width="230" height="44" rx="9" fill="#1c1c20" stroke="#3fb950"/>
      <text x="415" y="122" text-anchor="middle" fill="#f5f5f6" font-weight="700">S3 · Objetos</text>
      <text x="415" y="138" text-anchor="middle" fill="#9a9aa3" font-size="10">buckets, versionado</text>
      <rect x="300" y="152" width="230" height="44" rx="9" fill="#1c1c20" stroke="#FDDA24"/>
      <text x="415" y="174" text-anchor="middle" fill="#f5f5f6" font-weight="700">IAM · Roles y políticas</text>
      <text x="415" y="190" text-anchor="middle" fill="#9a9aa3" font-size="10">menor privilegio · MFA</text>
    </g>
    <text x="285" y="244" text-anchor="middle" fill="#9a9aa3" font-size="10">Región = ubicación geográfica · AZ = unidad de aislamiento dentro de la región</text>
  </g>
</svg>
