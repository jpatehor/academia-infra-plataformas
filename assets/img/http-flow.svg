<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" role="img" aria-label="Flujo de una petición HTTP">
  <rect width="540" height="250" fill="#0f0f12"/>
  <text x="16" y="26" fill="#FDDA24" font-family="system-ui,sans-serif" font-size="14" font-weight="800">FLUJO DE UNA PETICIÓN WEB</text>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#f5f5f6">
    <!-- Browser -->
    <rect x="24" y="110" width="130" height="76" rx="12" fill="#1c1c20" stroke="#FDDA24"/>
    <text x="89" y="138" text-anchor="middle" font-weight="700">Navegador</text>
    <text x="89" y="160" text-anchor="middle" fill="#9a9aa3" font-size="11">ej. Google Chrome</text>
    <text x="89" y="177" text-anchor="middle" fill="#FDDA24" font-size="11">1. GET /index.html</text>
    <!-- DNS -->
    <rect x="205" y="26" width="130" height="66" rx="12" fill="#1c1c20" stroke="#2b2b31"/>
    <text x="270" y="52" text-anchor="middle" font-weight="700">DNS</text>
    <text x="270" y="74" text-anchor="middle" fill="#9a9aa3" font-size="11">puerto 53 · resuelve IP</text>
    <!-- Server -->
    <rect x="386" y="110" width="130" height="76" rx="12" fill="#1c1c20" stroke="#FDDA24"/>
    <text x="451" y="134" text-anchor="middle" font-weight="700">Servidor Web</text>
    <text x="451" y="154" text-anchor="middle" fill="#9a9aa3" font-size="11">Nginx / Apache</text>
    <text x="451" y="177" text-anchor="middle" fill="#3fb950" font-size="11">200 OK + HTML</text>
    <!-- arrows -->
    <line x1="154" y1="132" x2="382" y2="132" stroke="#FDDA24" stroke-width="2"/>
    <polygon points="382,132 372,127 372,137" fill="#FDDA24"/>
    <text x="268" y="124" fill="#9a9aa3" font-size="10" text-anchor="middle">HTTP :80 / HTTPS :443</text>
    <line x1="382" y1="170" x2="158" y2="170" stroke="#3fb950" stroke-width="2"/>
    <polygon points="158,170 168,165 168,175" fill="#3fb950"/>
    <text x="268" y="186" fill="#9a9aa3" font-size="10" text-anchor="middle">respuesta 200 OK</text>
    <line x1="120" y1="110" x2="240" y2="94" stroke="#2b2b31" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="240,94 229,91 233,101" fill="#2b2b31"/>
    <line x1="300" y1="94" x2="150" y2="112" stroke="#2b2b31" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="150,112 160,105 162,115" fill="#2b2b31"/>
    <text x="270" y="238" fill="#9a9aa3" font-size="11" text-anchor="middle">TLS añade cifrado en la capa de transporte (HTTPS = 443)</text>
  </g>
</svg>
